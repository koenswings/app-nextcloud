x-app:
  name: nextcloud
  title: Nextcloud
  description: >
    With over 400.000 deployments, Nextcloud is the most popular on-premises
    content collaboration platform you can download. 

    It scales from a Raspberry Pi with 2 users to globally distributed installations with tens of millions of users at major hosting providers.
  url: https://nextcloud.com/
  category: office
  icon: nextcloud.png
  author: Koen Swings
  version: b8ad4382b5f77c1de84cdf05ae822d4041b02b3c
  instanceName: nextcloud
  filesMount:
    path: /mnt/idea-files
    services: [nextcloud-app]
  # idea#193: Engine binds host /run/idea-usb -> /mnt/idea-usb (ro, rslave) once;
  # then runs `docker exec -u www-data <nextcloud-app> /idea/usb-sync.sh` at start
  # and after every USB stick plug/unplug.
  usbMount:
    path: /mnt/idea-usb
    services: [nextcloud-app]
networks:
  backend: null
services:
  nextcloud-app:
    #image: nextcloud
    image: koenswings/nextcloud:1.0-31.0.1
    restart: no
    pull_policy: never
    # Root wrapper chowns /mnt/idea-files/* to uid 33 when wrong, then execs image entrypoint.
    # Hook reconciles Local external storages with Files Disk folders (idea#137).
    entrypoint: ["/idea-files-entrypoint.sh"]
    # Image CMD is dropped when entrypoint is overridden — restore it.
    command: ["apache2-foreground"]
    volumes:
      - ./data/nextcloud:/var/www/html
      - ./idea-files-entrypoint.sh:/idea-files-entrypoint.sh:ro
      # All hook folders (pre-installation, post-installation, before-starting).
      - ./docker-entrypoint-hooks.d:/docker-entrypoint-hooks.d:ro
      # Apps shipped on the App Disk (richdocuments for offline Office), see docs/first-start.md.
      - ./bundled-apps:/idea-bundled-apps:ro
      # USB stick reconcile (idea#193), run by the Engine via docker exec.
      - ./usb-sync.sh:/idea/usb-sync.sh:ro
      # Sets trusted_domains for the Pi it runs on, on every start (agent-engine-dev#163)
      - ./docker-entrypoint-hooks.d/before-starting/20-idea-trusted-domains.sh:/docker-entrypoint-hooks.d/before-starting/20-idea-trusted-domains.sh:ro
    ports:
      - ${port}:80
    environment:
      - MYSQL_PASSWORD=${pass}            # internal DB password: stays generated
      # IDEA default: admin / admin911! (<account name>911!, change before real use).
      # IDEA_NC_ADMIN_PASSWORD still overrides it; the fallback is admin911!, not
      # ${pass}, so the admin login is never a random hard-to-type value.
      # Only used by the first-start auto-install; an existing admin is never reset.
      # (NEXTCLOUD_ADMIN_USER / NEXTCLOUD_ADMIN_PASSWORD are set once, below, with the self-install env.)
      # Seed users (password <name>911!), see docs/accounts.md. "" = none.
      - IDEA_NC_SEED_USERS=${IDEA_NC_SEED_USERS-teacher1:teachers learner1:learners}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=nextcloud-db
      # First start installs itself (official image auto-install), then runs
      # post-installation hooks (Office), then before-starting hooks (Files Disks, Office).
      - NEXTCLOUD_ADMIN_USER=admin
      # Separate admin secret from the Engine (agent-engine-dev issue, see docs/first-start.md).
      # Fallback is the IDEA default admin911! (<account name>911! scheme), never the random ${pass}.
      - NEXTCLOUD_ADMIN_PASSWORD=${IDEA_NC_ADMIN_PASSWORD:-admin911!}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost ${hostname} ${hostname}.local ${ip}
      # Office (CODE) has NO host port (no fixed 9980 shared between instances): Apache in this
      # container proxies /browser, /hosting and /cool to this instance's own `code` service
      # (IDEA_COLLABORA_PROXY). The browser reaches Office on this Nextcloud's own port, on the
      # LAN IP the Engine passes as ${ip} (no Tailscale special case); Nextcloud reaches CODE
      # server-side on the internal compose network.
      - IDEA_COLLABORA_URL=http://${ip}:${port}
      - IDEA_COLLABORA_INTERNAL_URL=http://code:9980
      - IDEA_COLLABORA_PROXY=http://code:9980
      - PHP_UPLOAD_LIMIT=10G
      - PHP_MEMORY_LIMIT=512M
      # Written into the instance .env by the Engine on every start; empty with an older Engine (hook then does nothing)
      - IDEA_HOSTNAME=${IDEA_HOSTNAME:-}
      - IDEA_HOST_IPS=${IDEA_HOST_IPS:-}
      # Files Disk and USB stick storages are visible to this group + admin only (created if missing).
      - IDEA_TEACHERS_GROUP=${IDEA_TEACHERS_GROUP:-teachers}
    networks:
      - backend
  nextcloud-db:
    #image: mariadb
    image: koenswings/nextcloud-mariadb:1.0-11.7.2-MariaDB-ubu2404
    restart: no
    pull_policy: never
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
      --innodb-file-per-table=1 --skip-innodb-read-only-compressed
    volumes:
      - ./data/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${pass}
      - MYSQL_PASSWORD=${pass}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - backend
  code:
    #image: collabora/code
    image: koenswings/nextcloud-code:1.0-24.04.13.2
    restart: no
    pull_policy: never
    # No host port: reached only through the nextcloud-app proxy and the backend network.
    environment:
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false
    extra_hosts:
      - ${hostname}.local:${ip}
    networks:
      - backend
