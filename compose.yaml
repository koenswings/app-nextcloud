x-app:
  name: nextcloud
  title: Nextcloud
  description: >
    With over 400.000 deployments, Nextcloud is the most popular on-premises
    content collaboration platform you can download. 

    It scales from a Raspberry Pi with 2 users to globally distributed installations with tens of millions of users at major hosting providers.
  url: https://nextcloud.com/
  category: office
  icon: nextcloud.png
  author: Koen Swings
  version: 6900555403c84463e2c8ac53e49cc9c08536669e
  instanceName: nextcloud
  filesMount:
    path: /mnt/idea-files
    services: [nextcloud-app]
  # idea#193: Engine binds host /run/idea-usb -> /mnt/idea-usb (ro, rslave) once;
  # then runs `docker exec -u www-data <nextcloud-app> /idea/usb-sync.sh` at start
  # and after every USB stick plug/unplug.
  usbMount:
    path: /mnt/idea-usb
    services: [nextcloud-app]
networks:
  backend: null
services:
  nextcloud-app:
    #image: nextcloud
    image: koenswings/nextcloud:1.0-31.0.1
    restart: no
    pull_policy: never
    # Root wrapper chowns /mnt/idea-files/* to uid 33 when wrong, then execs image entrypoint.
    # Hook reconciles Local external storages with Files Disk folders (idea#137).
    entrypoint: ["/idea-files-entrypoint.sh"]
    # Image CMD is dropped when entrypoint is overridden — restore it.
    command: ["apache2-foreground"]
    volumes:
      - ./data/nextcloud:/var/www/html
      - ./idea-files-entrypoint.sh:/idea-files-entrypoint.sh:ro
      - ./docker-entrypoint-hooks.d/before-starting/10-idea-files.sh:/docker-entrypoint-hooks.d/before-starting/10-idea-files.sh:ro
      # USB stick reconcile (idea#193), run by the Engine via docker exec.
      - ./usb-sync.sh:/idea/usb-sync.sh:ro
    ports:
      - ${port}:80
    environment:
      - MYSQL_PASSWORD=${pass}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=nextcloud-db
      - PHP_UPLOAD_LIMIT=10G
      - PHP_MEMORY_LIMIT=512M
      # Files Disk and USB stick storages are visible to this group + admin only (created if missing).
      - IDEA_TEACHERS_GROUP=${IDEA_TEACHERS_GROUP:-teachers}
    networks:
      - backend
  nextcloud-db:
    #image: mariadb
    image: koenswings/nextcloud-mariadb:1.0-11.7.2-MariaDB-ubu2404
    restart: no
    pull_policy: never
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
      --innodb-file-per-table=1 --skip-innodb-read-only-compressed
    volumes:
      - ./data/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${pass}
      - MYSQL_PASSWORD=${pass}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - backend
  code:
    #image: collabora/code
    image: koenswings/nextcloud-code:1.0-24.04.13.2
    restart: no
    pull_policy: never
    ports:
      - 9980:9980
    environment:
      - extra_params=--o:ssl.enable=false
    extra_hosts:
      - ${hostname}.local:${ip}
    networks:
      - backend
