app: nextcloud
idea_app_version: "1.0"

compatibility:
  engine_min: "0.9.0"
  # 1.5-31.0.1 (idea_usage counter + empty skeleton, idea#464): 7-step on-Pi check on Engine 431ab4c (steps 1–6 idea04, step 7 idea03) at af5f289. Earlier checks on idea03 at c460aca, 1224f54 and 3fa97b1 (pre-install skeleton config), throwaway compose projects.
  engine_tested:
    commit: "431ab4c"
    version: "1.0"
    date: "2026-11-14"

services:
  - name: nextcloud-app
    build: retag
    upstream: nextcloud
    upstream_tag: "31-apache"
    image: koenswings/nextcloud
    current_version: "1.0-31.0.1"
    monitors:
      - kind: dockerhub
        repo: library/nextcloud
        tag_pattern: "^\\d+-apache$"

  - name: nextcloud-db
    build: retag
    upstream: mariadb
    upstream_tag: "11.7"
    image: koenswings/nextcloud-mariadb
    current_version: "1.0-11.7.2-MariaDB-ubu2404"
    monitors:
      - kind: dockerhub
        repo: library/mariadb
        tag_pattern: "^11\\.\\d+$"

  - name: nextcloud-code
    build: retag
    upstream: collabora/code
    upstream_tag: "24.04.13.2"
    image: koenswings/nextcloud-code
    current_version: "1.0-24.04.13.2"
    monitors:
      - kind: dockerhub
        repo: collabora/code
        tag_pattern: "^\\d+\\.\\d+\\.\\d+\\.\\d+$"

# Demo apps (agent-engine-dev#369, Console "Demo apps" / setupDemo). The Engine downloads the
# pinned pack (or takes IDEA-DEMO/idea-demo-nextcloud-vN.tar or IDEA-DEMO/nextcloud/pack.json
# from a docked disk or USB stick), checks the sha256, extracts it to <instance>/demo-pack/x,
# starts the "Nextcloud Demo" instance and runs demo/hook.sh seed. Rebuild the pack with
# demo/build-demo-pack.py and re-pin sha256 and bytes here. See demo/README.md.
demo:
  name: "Nextcloud Demo"
  minEngine: "1.0"
  pack:
    file: idea-demo-nextcloud-v1.tar
    url: https://github.com/koenswings/app-nextcloud/releases/download/idea-demo-nextcloud-v1/idea-demo-nextcloud-v1.tar
    sha256: "deabeacbde8bb2e31e564a9f300ecfad5d6195473a79a2f6c489cb6f9e03a745"
    bytes: 450560
    minVersion: 1
  reserveBytes: 1000000000
  steps:
    - { id: seed, run: demo/hook.sh seed, needs: running, timeoutSec: 1200 }
